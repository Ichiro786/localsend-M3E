name: Phase 4 Android release APKs

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  build-release-apks:
    name: Build Android release APKs
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Require production signing credentials
        env:
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
          ANDROID_KEY_STORE: ${{ secrets.ANDROID_KEY_STORE }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEY_PROPERTIES" ] || [ -z "$ANDROID_KEY_STORE" ]; then
            echo 'Release signing credentials are missing. Configure both ANDROID_KEY_PROPERTIES and ANDROID_KEY_STORE repository secrets before running this workflow.'
            exit 1
          fi
          echo 'Release signing credentials are present; production signing is required.'

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Decode release signing files
        working-directory: app/android
        env:
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
          ANDROID_KEY_STORE: ${{ secrets.ANDROID_KEY_STORE }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEY_PROPERTIES" | base64 --decode > key.properties
          test -s key.properties
          grep -Eq '^keyAlias=.+$' key.properties
          grep -Eq '^keyPassword=.+$' key.properties
          grep -Eq '^storePassword=.+$' key.properties
          printf '%s' "$ANDROID_KEY_STORE" | base64 --decode > /tmp/localsend-m3e-release.jks
          test -s /tmp/localsend-m3e-release.jks
          sed -i "s#^storeFile=.*#storeFile=/tmp/localsend-m3e-release.jks#" key.properties

      - name: Resolve Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Build ARMv7 and ARM64 split release APKs
        working-directory: app
        run: flutter build apk --release --target-platform android-arm,android-arm64 --split-per-abi --no-pub

      - name: Verify signed release identity and report sizes
        working-directory: app
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          set -euo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -x "$AAPT"
          test -x "$APKSIGNER"
          for apk in \
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk; do
            test -f "$apk"
            test ! -f "$(dirname "$apk")/base.apk"
            verify_output=$("$APKSIGNER" verify --verbose --print-certs "$apk")
            printf '%s\n' "$verify_output" | grep -Eq 'Verified using v[123] scheme.*: true'
            printf '%s\n' "$verify_output" | grep -Fq 'Number of signers: 1'
            printf '%s\n' "$verify_output" | grep -Fq 'Signer #1 certificate DN:'
            if printf '%s\n' "$verify_output" | grep -Fq 'CN=Android Debug'; then
              echo "Debug signing certificate found in $apk"
              exit 1
            fi
            "$AAPT" dump badging "$apk" | grep -F "package: name='com.localsend.m3e'"
            "$AAPT" dump badging "$apk" | grep -F "application-label:'LocalSend'"
            if "$AAPT" dump badging "$apk" | grep -Fq "org.localsend.localsend_app"; then
              echo "Official application identity found in $apk"
              exit 1
            fi
            stat -c '%n %s bytes' "$apk"
          done
          echo 'Signed release identity and certificate checks passed.'

      - name: Upload release APKs
        uses: actions/upload-artifact@v6
        with:
          name: localsend-m3e-release-apks
          if-no-files-found: error
          path: |
            app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Remove temporary signing files
        if: always()
        run: rm -f app/android/key.properties /tmp/localsend-m3e-release.jks
