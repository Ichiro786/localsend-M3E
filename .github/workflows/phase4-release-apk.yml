name: Phase 4 Android release APKs

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  build-release-apks:
    name: Build Android release APKs
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check release signing availability
        id: signing
        env:
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
          ANDROID_KEY_STORE: ${{ secrets.ANDROID_KEY_STORE }}
        run: |
          if [ -n "$ANDROID_KEY_PROPERTIES" ] && [ -n "$ANDROID_KEY_STORE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo 'Production signing secrets are available; release APKs will be signed.'
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo 'Production signing secrets are unavailable; release APKs will be unsigned for size/identity validation only.'
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Decode release signing files
        if: steps.signing.outputs.available == 'true'
        working-directory: app/android
        env:
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
          ANDROID_KEY_STORE: ${{ secrets.ANDROID_KEY_STORE }}
        run: |
          printf '%s' "$ANDROID_KEY_PROPERTIES" | base64 --decode > key.properties
          printf '%s' "$ANDROID_KEY_STORE" | base64 --decode > /tmp/localsend-m3e-release.jks
          sed -i "s#^storeFile=.*#storeFile=/tmp/localsend-m3e-release.jks#" key.properties

      - name: Resolve Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Build ARM64 split release APK
        working-directory: app
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi --no-pub

      - name: Build universal release APK
        working-directory: app
        run: flutter build apk --release --no-pub

      - name: Verify release identity and report sizes
        working-directory: app
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          SIGNING_AVAILABLE: ${{ steps.signing.outputs.available }}
        run: |
          set -e
          echo "signing_available=$SIGNING_AVAILABLE"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          test -x "$AAPT"
          for apk in \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/app-release.apk; do
            test -f "$apk"
            "$AAPT" dump badging "$apk" | grep -F "package: name='com.localsend.m3e'"
            "$AAPT" dump badging "$apk" | grep -F "application-label:'LocalSend'"
            if "$AAPT" dump badging "$apk" | grep -Fq "org.localsend.localsend_app"; then
              echo "Official application identity found in $apk"
              exit 1
            fi
            stat -c '%n %s bytes' "$apk"
          done
          if [ "$SIGNING_AVAILABLE" = 'true' ]; then
            echo 'Release identity and signed-artifact checks passed.'
          else
            echo 'Release identity and unsigned size-artifact checks passed.'
          fi

      - name: Upload release APKs
        uses: actions/upload-artifact@v6
        with:
          name: localsend-m3e-release-apks
          if-no-files-found: error
          path: |
            app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            app/build/app/outputs/flutter-apk/app-release.apk

      - name: Remove temporary signing files
        if: always()
        run: rm -f app/android/key.properties /tmp/localsend-m3e-release.jks
