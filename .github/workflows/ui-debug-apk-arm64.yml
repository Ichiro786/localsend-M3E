name: LocalSend UI debug APK (ARM64)

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

# Keep this workflow independent from release/package workflows. It builds only
# the debug APK used for UI development and does not require release signing.
env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  build-ui-debug-arm64:
    name: Build Android debug APK for arm64-v8a
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Build ARM64 debug APK
        working-directory: app
        run: flutter build apk --debug --target-platform android-arm64

      - name: Verify APK output and ARM64 payload
        working-directory: app
        shell: bash
        run: |
          apk="build/app/outputs/flutter-apk/app-debug.apk"
          test -f "$apk"
          unzip -l "$apk" > "$RUNNER_TEMP/apk-contents.txt"
          grep -q 'lib/arm64-v8a/' "$RUNNER_TEMP/apk-contents.txt"
          if grep -Eq 'lib/(armeabi-v7a|x86|x86_64)/' "$RUNNER_TEMP/apk-contents.txt"; then
            echo "Unexpected non-ARM64 native libraries found in $apk"
            exit 1
          fi
          echo "Verified ARM64-only debug APK: $apk"

      - name: Upload ARM64 debug APK
        uses: actions/upload-artifact@v6
        with:
          name: localsend-debug-arm64
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
