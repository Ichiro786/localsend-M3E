name: LocalSend M3E Android Production Release

on:
  push:
    branches: [sesori/ui-feedback-round-apply]
    paths: [.github/workflows/android-release.yml, RELEASE_NOTES_V1.0.1.md]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: localsend-m3e-android-production-release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.41.9"
  APK_BUILD_DIR: "/tmp/build"
  EXPECTED_VERSION: "1.0.1"
  EXPECTED_VERSION_CODE: "65"
  EXPECTED_CERT_SHA256: "64e3fbeef0c3c60df53499a87e00de23d3b8beee2869b29b59bfb1e7c2e062cf"
  RELEASE_TAG: "v1.0.1"

jobs:
  verify_ci:
    name: Require passing CI for the exact release commit
    if: "github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release: v1.0.1')"
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Check synchronized release metadata
        run: |
          set -euo pipefail
          grep -Fxq "version: $EXPECTED_VERSION+$EXPECTED_VERSION_CODE" app/pubspec.yaml
          grep -Fxq "version = \"$EXPECTED_VERSION\"" cli/Cargo.toml
          grep -Fxq "#define MyAppVersion \"$EXPECTED_VERSION\"" support/scripts/compile_windows_exe-inno.iss
          test -s RELEASE_NOTES_V1.0.1.md
          if git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing $RELEASE_TAG." >&2
            exit 1
          fi
      - name: Wait for formatting, analyzers, Flutter tests and Rust regressions
        run: |
          set -euo pipefail
          run_id=""
          for attempt in $(seq 1 60); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/nav-glass-arm64.yml/runs?per_page=30")
            run_id=$(printf '%s' "$runs" | jq -r --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .event == "push")][0].id // empty')
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 5
          done
          test -n "$run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --interval 10 --exit-status

  build_android:
    name: Build and verify signed ARM APKs
    needs: verify_ci
    timeout-minutes: 90
    runs-on: ubuntu-22.04
    outputs:
      verified_commit: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Record release commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Remove proprietary dependencies
        run: sh support/scripts/remove_proprietary_dependencies.sh

      - name: Copy files to isolated Android build directory
        run: |
          set -euo pipefail
          mkdir -p "$APK_BUILD_DIR"
          cp -a . "$APK_BUILD_DIR/"

      - name: Require production signing credentials
        env:
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
          ANDROID_KEY_STORE: ${{ secrets.ANDROID_KEY_STORE }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEY_PROPERTIES" ] || [ -z "$ANDROID_KEY_STORE" ]; then
            echo "Production signing credentials are missing. Configure ANDROID_KEY_PROPERTIES and ANDROID_KEY_STORE."
            exit 1
          fi
          echo "Production signing credentials are present."

      - name: Decode key.properties
        working-directory: ${{ env.APK_BUILD_DIR }}
        env:
          ENCODED_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          set -euo pipefail
          printf '%s' "$ENCODED_KEY_PROPERTIES" | base64 --decode > app/android/key.properties
          test -s app/android/key.properties
          grep -Eq '^keyAlias=.+$' app/android/key.properties
          grep -Eq '^keyPassword=.+$' app/android/key.properties
          grep -Eq '^storePassword=.+$' app/android/key.properties

      - name: Decode permanent Android keystore
        working-directory: ${{ env.APK_BUILD_DIR }}
        env:
          ENCODED_KEY_STORE: ${{ secrets.ANDROID_KEY_STORE }}
        run: |
          set -euo pipefail
          mkdir -p secrets
          printf '%s' "$ENCODED_KEY_STORE" | base64 --decode > secrets/android-keystore.jks
          test -s secrets/android-keystore.jks
          sed -i "s#^storeFile=.*#storeFile=$APK_BUILD_DIR/secrets/android-keystore.jks#" app/android/key.properties
          grep -Fq "storeFile=$APK_BUILD_DIR/secrets/android-keystore.jks" app/android/key.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install pinned Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Check Rust toolchain
        working-directory: ${{ env.APK_BUILD_DIR }}/packages/localsend_isolates
        run: rustup show

      - name: Install Dart dependencies
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: flutter pub get

      - name: Install cargokit build dependencies
        working-directory: ${{ env.APK_BUILD_DIR }}/packages/localsend_isolates/rust_builder/cargokit/build_tool
        run: flutter pub get

      - name: Build exactly ARMv7 and ARM64 release APKs
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: flutter build apk --release --target-platform android-arm,android-arm64 --split-per-abi --tree-shake-icons --split-debug-info=build/symbols --no-pub

      - name: Verify signed, installable APKs and release metadata
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          set -euo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -1)
          test -x "$AAPT"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"

          APK_DIR="build/app/outputs/flutter-apk"
          mapfile -t APK_FILES < <(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -printf '%f\n' | sort)
          test "${#APK_FILES[@]}" -eq 2
          printf '%s\n' "${APK_FILES[@]}" | grep -Fxq 'app-armeabi-v7a-release.apk'
          printf '%s\n' "${APK_FILES[@]}" | grep -Fxq 'app-arm64-v8a-release.apk'
          ! printf '%s\n' "${APK_FILES[@]}" | grep -Eq 'x86|base\.apk|app-release\.apk'

          for apk in \
            "$APK_DIR/app-armeabi-v7a-release.apk" \
            "$APK_DIR/app-arm64-v8a-release.apk"; do
            test -s "$apk"
            "$ZIPALIGN" -c -v 4 "$apk"
            if ! verify_output=$("$APKSIGNER" verify --verbose --print-certs "$apk" 2>&1); then
              echo "APK signature verification failed: $apk"
              printf '%s\n' "$verify_output"
              exit 1
            fi
            printf '%s\n' "$verify_output" | grep -Eq 'Verified using v[123] scheme.*: true'
            printf '%s\n' "$verify_output" | grep -Fq 'Number of signers: 1'
            certificate_digest=$(printf '%s\n' "$verify_output" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
            test "$certificate_digest" = "$EXPECTED_CERT_SHA256"
            ! printf '%s\n' "$verify_output" | grep -Fq 'CN=Android Debug'

            badging=$("$AAPT" dump badging "$apk")
            case "$apk" in
              *app-armeabi-v7a-release.apk) expected_abi_code=$((EXPECTED_VERSION_CODE * 10 + 2)) ;;
              *app-arm64-v8a-release.apk) expected_abi_code=$((EXPECTED_VERSION_CODE * 10 + 3)) ;;
              *) echo "Unexpected APK path: $apk"; exit 1 ;;
            esac
            printf '%s\n' "$badging" | grep -Fq "package: name='com.localsend.m3e' versionCode='$expected_abi_code' versionName='$EXPECTED_VERSION'"
            printf '%s\n' "$badging" | grep -Fq "application-label:'LocalSend'"
            ! printf '%s\n' "$badging" | grep -Fq 'org.localsend.localsend_app'

            ! printf '%s\n' "$badging" | grep -Fq 'application-debuggable'
            case "$apk" in
              *app-armeabi-v7a-release.apk) expected_abi=armeabi-v7a ;;
              *app-arm64-v8a-release.apk) expected_abi=arm64-v8a ;;
            esac
            mapfile -t native_abis < <(unzip -Z1 "$apk" | awk -F/ '$1 == "lib" && NF >= 3 { print $2 }' | sort -u)
            test "${#native_abis[@]}" -eq 1
            test "${native_abis[0]}" = "$expected_abi"
            stat -c '%n %s bytes' "$apk"
          done
          echo "Signed and installable ARM APK verification passed."

      - name: Prepare exact Android release asset names
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "LocalSend-${EXPECTED_VERSION}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "LocalSend-${EXPECTED_VERSION}-armeabi-v7a.apk"
          sha256sum "LocalSend-${EXPECTED_VERSION}-arm64-v8a.apk" "LocalSend-${EXPECTED_VERSION}-armeabi-v7a.apk" > SHA256SUMS
          cat SHA256SUMS

      - name: Upload only the two Android APKs for publication
        uses: actions/upload-artifact@v6
        with:
          name: localsend-m3e-android-release-apks
          if-no-files-found: error
          path: |
            ${{ env.APK_BUILD_DIR }}/app/LocalSend-${{ env.EXPECTED_VERSION }}-arm64-v8a.apk
            ${{ env.APK_BUILD_DIR }}/app/LocalSend-${{ env.EXPECTED_VERSION }}-armeabi-v7a.apk
            ${{ env.APK_BUILD_DIR }}/app/SHA256SUMS

      - name: Preserve Dart symbols for crash analysis
        uses: actions/upload-artifact@v6
        with:
          name: LocalSend-M3E-1.0.1-Dart-symbols
          path: ${{ env.APK_BUILD_DIR }}/app/build/symbols/
          if-no-files-found: error
          retention-days: 90

      - name: Remove temporary signing files
        if: always()
        run: |
          rm -f "$APK_BUILD_DIR/app/android/key.properties"
          rm -f "$APK_BUILD_DIR/secrets/android-keystore.jks"

  publish_android:
    name: Tag and publish Android-only v1.0.1 release
    needs: build_android
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: v1.0.1
      VERIFIED_COMMIT: ${{ needs.build_android.outputs.verified_commit }}
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.build_android.outputs.verified_commit }}
          fetch-depth: 0

      - name: Confirm tag does not exist before verification-backed publication
        run: |
          set -euo pipefail
          if git ls-remote --exit-code origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing $TAG. Remove the stale tag before rerunning."
            exit 1
          fi

      - name: Download the two verified Android APKs
        uses: actions/download-artifact@v7
        with:
          name: localsend-m3e-android-release-apks
          path: android-release-apks

      - name: Confirm publication contains exactly two APK assets
        run: |
          set -euo pipefail
          mapfile -t assets < <(find android-release-apks -maxdepth 1 -type f -name '*.apk' -printf '%f\n' | sort)
          test "${#assets[@]}" -eq 2
          printf '%s\n' "${assets[@]}" | grep -Fxq 'LocalSend-1.0.1-arm64-v8a.apk'
          printf '%s\n' "${assets[@]}" | grep -Fxq 'LocalSend-1.0.1-armeabi-v7a.apk'
          ! printf '%s\n' "${assets[@]}" | grep -Eq 'x86|x86_64|linux|windows|AppImage|\.deb|\.tar'

      - name: Create v1.0.1 tag only after Android verification succeeds
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$VERIFIED_COMMIT" -m "LocalSend M3E v1.0.1 Android production release"
          git push origin "refs/tags/$TAG"

      - name: Generate Android-only release changelog
        run: |
          set -euo pipefail
          cp RELEASE_NOTES_V1.0.1.md release-notes.md
          sed -i "s/Release date | To be set when the signed GitHub Release is published/Release date | $(date -u +%Y-%m-%d)/" release-notes.md
          printf '\n## APK SHA-256 checksums\n\n```text\n' >> release-notes.md
          cat android-release-apks/SHA256SUMS >> release-notes.md
          printf '```\n' >> release-notes.md

      - name: Create GitHub Release with only the two Android APKs
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "android-release-apks/LocalSend-1.0.1-arm64-v8a.apk" \
            "android-release-apks/LocalSend-1.0.1-armeabi-v7a.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$VERIFIED_COMMIT" \
            --title "LocalSend M3E v1.0.1" \
            --notes-file release-notes.md

      - name: Verify published release asset set
        run: |
          set -euo pipefail
          mapfile -t published < <(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort)
          test "${#published[@]}" -eq 2
          printf '%s\n' "${published[@]}" | grep -Fxq 'LocalSend-1.0.1-arm64-v8a.apk'
          printf '%s\n' "${published[@]}" | grep -Fxq 'LocalSend-1.0.1-armeabi-v7a.apk'
          ! printf '%s\n' "${published[@]}" | grep -Eq 'x86|x86_64|linux|windows|AppImage|\.deb|\.tar'
          echo "Published Android-only release asset set verified."

      - name: Download and verify both public APKs
        run: |
          set -euo pipefail
          download_dir="$RUNNER_TEMP/public-release-check"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$download_dir" --pattern '*.apk'
          cp android-release-apks/SHA256SUMS "$download_dir/SHA256SUMS"
          cd "$download_dir"
          sha256sum --check SHA256SUMS
          echo "Both published downloads match the verified build."
